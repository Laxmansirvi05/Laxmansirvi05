<svg width="480" height="195" viewBox="0 0 480 195" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" rx="10" width="479" height="194" fill="#0D1117" stroke="#1f2430"/>
  <text x="25" y="35" fill="#6366F1" font-size="19" font-weight="700">Laxman's GitHub Stats</text>
  <line x1="25" y1="48" x2="290" y2="48" stroke="#1f2430" stroke-width="1"/>

  <!-- left stat rows -->
  <g font-size="14.5">
    <circle cx="30" cy="74" r="3" fill="#6366F1"/>
